name: Nix Update Hash

on:
  # This job commits a refreshed npm-deps hash as the upstream Paseo bot, which
  # needs the PASEO_BOT_APP_ID/PASEO_BOT_PRIVATE_KEY secrets this fork does not
  # have — every automatic run died at `Input required and not supplied: app-id`.
  # Nix is not an owner deployment channel either (see fork-releases.md), so the
  # hash only matters when someone deliberately checks the Nix build.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.PASEO_BOT_APP_ID }}
          private-key: ${{ secrets.PASEO_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update lockfile + Nix hash if stale
        run: ./scripts/update-nix.sh

      - name: Build Nix package
        run: nix build .#default -o result

      - name: Commit hash/lockfile updates
        run: |
          git diff --quiet package-lock.json nix/npm-deps.hash && exit 0
          git config user.name "paseo-ai[bot]"
          git config user.email "266920839+paseo-ai[bot]@users.noreply.github.com"
          git add package-lock.json nix/npm-deps.hash
          git commit -m "fix: update lockfile signatures and Nix hash [skip ci]"
          git push
